<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kisan Mandi & Crop Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans+Gurmukhi:wght@400;600;700;800&family=Noto+Sans+Oriya:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --field-deep:#1F3D2B;
  --field-mid:#2C4F32;
  --field-soft:#3E6B44;
  --marigold:#E8890C;
  --marigold-dark:#C46F02;
  --turmeric:#F2B705;
  --grain:#F3F5E9;
  --grain-card:#FFFFFF;
  --soil:#4A3728;
  --ink:#1B2118;
  --line:#DDE3CE;
  --danger:#B3261E;
  --danger-bg:#FBEAE8;
  --ok:#2E7D32;
  --ok-bg:#E9F5E9;
  --radius:14px;
  --font: 'Noto Sans','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Nastaliq Urdu',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --grain:#151A12; --grain-card:#1E251A; --ink:#EDEFE6; --soil:#CBB89E;
    --line:#33402C; --field-deep:#274A34; --field-mid:#33623F;
    --danger-bg:#3A1F1D; --ok-bg:#183824;
  }
}
:root[data-theme="dark"]{
  --grain:#151A12; --grain-card:#1E251A; --ink:#EDEFE6; --soil:#CBB89E;
  --line:#33402C; --field-deep:#274A34; --field-mid:#33623F;
  --danger-bg:#3A1F1D; --ok-bg:#183824;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; font-family:var(--font); background:var(--grain); color:var(--ink);
  height:100%; overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent;
}
[dir="rtl"] body{direction:rtl;}
button, input, select, textarea{font-family:inherit;}
button{cursor:pointer;}
.app{max-width:520px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; background:var(--grain);}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--field-deep); color:#fff;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
}
.topbar-row1{display:flex; align-items:center; gap:10px;}
.brand{display:flex; align-items:center; gap:8px; flex:1; min-width:0;}
.brand-emoji{font-size:22px;}
.brand-text{font-weight:800; font-size:16px; line-height:1.15;}
.brand-sub{font-size:10.5px; opacity:.75; font-weight:600;}
.pillbtn{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff;
  border-radius:20px; padding:6px 10px; font-size:12px; font-weight:700; white-space:nowrap;
  display:flex; align-items:center; gap:4px;
}
.topbar-row2{display:flex; gap:8px; margin-top:8px;}
.searchbar{
  flex:1; display:flex; align-items:center; gap:6px; background:#fff; border-radius:24px; padding:8px 12px;
}
.searchbar input{border:none; outline:none; flex:1; font-size:14px; color:var(--ink); background:transparent; min-width:0;}
.searchbar button{border:none; background:transparent; font-size:16px; padding:2px; color:var(--field-deep);}
.screen{padding:14px 14px 90px;}
.section-title{font-size:19px; font-weight:800; margin:2px 0 10px; color:var(--ink);}
.subtle{color:var(--soil); font-size:13px; line-height:1.5;}
.disclaimer{
  background:var(--turmeric); color:#3A2A00; border-radius:10px; padding:9px 12px; font-size:12.5px;
  font-weight:600; margin-bottom:14px; line-height:1.4; border-left:4px solid var(--marigold-dark);
}
.disclaimer.soft{background:var(--grain-card); color:var(--soil); border:1px solid var(--line); border-left:4px solid var(--field-soft); font-weight:500;}
.grid-cards{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.feature-card{
  background:var(--grain-card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 12px;
  display:flex; flex-direction:column; gap:6px; text-align:left; border-left:5px solid var(--accent,var(--field-soft));
  min-height:96px; justify-content:center;
}
.feature-card .ico{font-size:24px;}
.feature-card .lbl{font-weight:700; font-size:13.5px; line-height:1.25; color:var(--ink);}
.card{
  background:var(--grain-card); border:1px solid var(--line); border-radius:var(--radius); padding:14px;
  margin-bottom:12px;
}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 16px;}
.chip{
  background:var(--grain-card); border:1px solid var(--line); border-radius:20px; padding:8px 14px; font-size:13.5px;
  font-weight:600; color:var(--ink);
}
.chip.active{background:var(--field-deep); color:#fff; border-color:var(--field-deep);}
.mic-btn{
  border:none; background:var(--marigold); color:#fff; border-radius:50%; width:38px; height:38px; font-size:16px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.mic-btn.listening{background:var(--danger); animation:pulse 1s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5);}70%{box-shadow:0 0 0 10px rgba(179,38,30,0);}100%{box-shadow:0 0 0 0 rgba(179,38,30,0);}}
.price-card{
  background:var(--grain-card); border:1px solid var(--line); border-left:5px solid var(--marigold); border-radius:var(--radius);
  padding:13px 14px; margin-bottom:10px;
}
.price-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.mandi-name{font-weight:800; font-size:14.5px;}
.mandi-loc{font-size:12px; color:var(--soil); margin-top:2px;}
.demo-badge{
  background:var(--danger-bg); color:var(--danger); font-size:9.5px; font-weight:800; padding:2px 7px;
  border-radius:5px; white-space:nowrap; letter-spacing:.2px;
}
.price-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px;}
.price-box{background:var(--grain); border-radius:8px; padding:7px 6px; text-align:center;}
.price-box .lbl{font-size:10px; color:var(--soil); font-weight:700;}
.price-box .val{font-size:14.5px; font-weight:800; color:var(--field-deep); margin-top:2px;}
.price-meta{display:flex; justify-content:space-between; margin-top:9px; font-size:11.5px; color:var(--soil);}
.btnrow{display:flex; gap:8px; margin-top:10px;}
.btn{
  border:none; border-radius:10px; padding:11px 14px; font-weight:700; font-size:13.5px; flex:1;
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-primary{background:var(--marigold); color:#fff;}
.btn-outline{background:transparent; border:1.5px solid var(--field-deep); color:var(--field-deep);}
.btn-ghost{background:var(--grain); color:var(--ink); border:1px solid var(--line);}
.btn:disabled{opacity:.55;}
.filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
.filters select{
  border:1px solid var(--line); background:var(--grain-card); border-radius:9px; padding:8px 10px; font-size:12.5px;
  color:var(--ink); font-weight:600; flex-shrink:0;
}
.sortrow{display:flex; gap:8px; margin-bottom:10px;}
.sortbtn{flex:1; padding:8px; border-radius:9px; border:1px solid var(--line); background:var(--grain-card); font-size:12px; font-weight:700; color:var(--soil);}
.sortbtn.active{background:var(--field-deep); color:#fff; border-color:var(--field-deep);}
.bottomnav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px;
  background:var(--grain-card); border-top:1px solid var(--line); display:flex; z-index:30;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
}
.navbtn{
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 2px; color:var(--soil); font-size:10.5px; font-weight:700; border-radius:10px;
}
.navbtn .ico{font-size:19px;}
.navbtn.active{color:var(--field-deep);}
.navbtn.active .ico{transform:scale(1.05);}
.backrow{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.backbtn{border:none; background:var(--grain-card); border:1px solid var(--line); border-radius:9px; width:34px; height:34px; font-size:15px; flex-shrink:0;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  background:var(--grain-card); width:100%; max-width:520px; border-radius:18px 18px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:82vh; overflow-y:auto;
}
.modal-title{font-weight:800; font-size:17px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;}
.closex{border:none; background:var(--grain); border-radius:50%; width:30px; height:30px; font-size:14px;}
.lang-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.lang-opt{
  border:1.5px solid var(--line); background:var(--grain); border-radius:10px; padding:11px 12px; text-align:left;
  font-weight:700; font-size:13.5px; display:flex; justify-content:space-between; align-items:center;
}
.lang-opt.active{border-color:var(--field-deep); background:var(--ok-bg);}
.lang-opt small{display:block; font-weight:500; font-size:11px; color:var(--soil); margin-top:1px;}
input[type=text], textarea, select.field{
  width:100%; border:1px solid var(--line); background:var(--grain); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--ink);
}
textarea{resize:vertical; min-height:70px;}
label.flabel{font-size:12.5px; font-weight:700; color:var(--soil); display:block; margin:10px 0 5px;}
.crop-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0;}
.crop-tile{
  background:var(--grain-card); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center;
  font-size:12px; font-weight:700;
}
.crop-tile .ico{font-size:22px; display:block; margin-bottom:3px;}
.emptystate{text-align:center; padding:36px 16px; color:var(--soil);}
.emptystate .ico{font-size:36px; display:block; margin-bottom:8px;}
.fab-mic{
  position:fixed; bottom:calc(72px + env(safe-area-inset-bottom,0px)); right:calc(50% - 250px + 16px); z-index:29;
  background:var(--field-deep); color:#fff; border:none; border-radius:50%; width:52px; height:52px; font-size:21px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
@media (max-width:552px){.fab-mic{right:16px;}}
.ai-box{background:var(--ok-bg); border:1px solid #bcd8bc; border-radius:10px; padding:12px; font-size:13.5px; line-height:1.55; white-space:pre-wrap;}
.ai-box.thinking{color:var(--soil); font-style:italic;}
.small-link{color:var(--field-deep); font-weight:700; font-size:12.5px; text-decoration:underline;}
table.compare-table{width:100%; border-collapse:collapse; font-size:12px;}
table.compare-table th, table.compare-table td{border:1px solid var(--line); padding:7px 6px; text-align:center;}
table.compare-table th{background:var(--field-deep); color:#fff; font-size:11px;}
.checkitem{display:flex; align-items:center; gap:8px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13.5px; font-weight:600;}
.res-item{border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:9px; background:var(--grain-card);}
.res-item a{color:var(--field-deep); font-weight:700; font-size:13px;}
.res-item p{margin:4px 0 0; font-size:12px; color:var(--soil);}
.confbar{height:6px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:4px;}
.confbar span{display:block; height:100%; background:var(--ok);}
.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.tag{background:var(--grain); border:1px solid var(--line); border-radius:7px; padding:3px 8px; font-size:11px; font-weight:700; color:var(--soil);}
.upload-box{
  border:2px dashed var(--line); border-radius:12px; padding:22px 14px; text-align:center; color:var(--soil); font-size:13px; font-weight:600;
}
.imgpreview{width:100%; border-radius:12px; margin-bottom:10px; max-height:260px; object-fit:cover;}
.favstar{border:none; background:none; font-size:18px;}
::-webkit-scrollbar{display:none;}
</style>

(function buildPrices(){
  var seed = 1;
  CROPS.forEach(function(crop){
    MANDIS.forEach(function(m, mi){
      seed++;
      var base = BASE_PRICE[crop.id] || 2000;
      var spread = 0.18 + seededRand(seed*7.3)*0.12;

      var daysAgo = Math.floor(seededRand(seed*5.5)*3);

  });
})();

/* ============== GEO / DISTANCE ============== */
function haversine(lat1,lon1,lat2,lon2){
  var R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* ============== SPEECH ============== */
var recognition = null, recognizing = false;
function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function startListening(onResult, onEnd){
  var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor) return false;
  try{
    recognition = new Ctor();
    recognition.lang = speechLangTag(state.lang);
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognizing = true;
    recognition.onresult = function(ev){
      var text = ev.results[0][0].transcript;
      onResult(text);
    };
    recognition.onerror = function(){ recognizing=false; if(onEnd) onEnd(); };
    recognition.onend = function(){ recognizing=false; if(onEnd) onEnd(); };
    recognition.start();
    return true;
  }catch(e){ return false; }
}
function stopListening(){ try{ if(recognition) recognition.stop(); }catch(e){} recognizing=false; }
function speechLangTag(l){
  var map={en:'en-IN', hi:'hi-IN', bn:'bn-IN', te:'te-IN', ta:'ta-IN', kn:'kn-IN', ml:'ml-IN', mr:'mr-IN', gu:'gu-IN', pa:'pa-IN', or:'or-IN', as:'as-IN', ur:'ur-IN'};
  return map[l]||'en-IN';
}
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = speechLangTag(state.lang);
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---- Mandi price data service (used ONLY by the Check Mandi Price screen) ----
   Record shape: crop_id, crop_name, state, district, mandi_name, variety,
   min_price, max_price, modal_price, unit, date (arrival date), updated_at,
   source, is_live.

   LIVE SOURCE: Government of India / data.gov.in
   Dataset: "Current Daily Price of Various Commodities from Various Markets (Mandi)"
   Resource id: 9ef84268-d588-465a-a308-a864a43d0070
   Fields in the real dataset: state, district, market, commodity, variety,
   grade, arrival_date, min_price, max_price, modal_price.

   SECURITY NOTE: a data.gov.in API key must never be embedded in this frontend
   file. Real access requires a small backend/serverless proxy that stores the
   key as an environment variable, calls
     https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070
       ?api-key=<server-side env var>&format=json&filters[commodity]=...
   and returns plain JSON to this page. Point MANDI_LIVE_PROXY_URL at that
   proxy to switch this screen from demo to live data. Until a real proxy is
   configured (and actually reachable), this screen keeps the DEMO DATA
   warning and never invents a price. */
var MANDI_LIVE_PROXY_URL = 'https://kisan-mandi-proxy.onrender.com/api/mandi-prices';
var GOV_SOURCE_LABEL = 'Government of India / data.gov.in';

function cropIdFromCommodity(name){
  if(!name) return null;
  var n = String(name).trim().toLowerCase();
  var hit = CROPS.filter(function(c){ return c.en.toLowerCase()===n || n.indexOf(c.en.toLowerCase())===0; })[0];
  return hit ? hit.id : null;
}

var MandiPriceService = {
  liveAdapter: null,
  normalize: function(p){
    var d = new Date(); d.setDate(d.getDate()-p.daysAgo); d.setHours(9,0,0,0);
    var crop = CROPS.filter(function(c){return c.id===p.crop;})[0];
    return {
      crop_id:p.crop, crop_name:crop?crop.en:p.crop, state:p.state, district:p.district, mandi_name:p.mandi,
      variety:null, min_price:p.min, max_price:p.max, modal_price:p.modal, unit:p.unit,
      date:d.toISOString().slice(0,10), updated_at:d.toISOString(), source:p.source,
      is_live:false, lat:p.lat, lng:p.lng
    };
  },
  // Maps one raw data.gov.in record (real field names) into our normalized shape.
  // Never invents a missing field — leaves it null instead.
  normalizeGovRecord: function(rec){
    var crop_id = cropIdFromCommodity(rec.commodity);
    var mandiMeta = MANDIS.filter(function(m){return m.name===rec.market;})[0];
    return {
      crop_id: crop_id, crop_name: rec.commodity || null, state: rec.state || null, district: rec.district || null,
      mandi_name: rec.market || null, variety: rec.variety || null,
      min_price: rec.min_price!=null ? Number(rec.min_price) : null,
      max_price: rec.max_price!=null ? Number(rec.max_price) : null,
      modal_price: rec.modal_price!=null ? Number(rec.modal_price) : null,
      unit:'quintal', date: rec.arrival_date || null, updated_at: new Date().toISOString(),
      source: GOV_SOURCE_LABEL, is_live:true,
      lat: mandiMeta? mandiMeta.lat : null, lng: mandiMeta? mandiMeta.lng : null
    };
  },
  getPrices: async function(f){
    var meta = {live:false, source:'Demo dataset (not live)', reason:'not_connected'};
    var records = null;
    if(MANDI_LIVE_PROXY_URL){
      try{
        var qs = [];
        if(f.crop){ var c=CROPS.filter(function(x){return x.id===f.crop;})[0]; if(c) qs.push('commodity='+encodeURIComponent(c.en)); }
        if(f.state) qs.push('state='+encodeURIComponent(f.state));
        var res = await fetch(MANDI_LIVE_PROXY_URL + (qs.length? '?'+qs.join('&') : ''), {method:'GET'});
        if(!res.ok) throw new Error('proxy_http_'+res.status);
        var json = await res.json();
        var raw = (json && json.records) ? json.records : [];
        records = raw.map(MandiPriceService.normalizeGovRecord).filter(function(r){
          return r.min_price!=null && r.max_price!=null && r.modal_price!=null;
        });
        if(records.length===0) throw new Error('proxy_empty');
        meta = {live:true, source:GOV_SOURCE_LABEL, reason:null};
      }catch(e){ records = null; meta.reason = 'live_failed'; }
    }
    if(!records){
      await new Promise(function(r){ setTimeout(r, 300); });
      records = PRICES.map(MandiPriceService.normalize);
    }
    if(f.crop) records = records.filter(function(r){return r.crop_id===f.crop;});
    if(f.state) records = records.filter(function(r){return r.state===f.state;});
    if(f.sort==='nearest' && state.coords){
      records.sort(function(a,b){
        var da = (a.lat!=null)? haversine(state.coords.lat,state.coords.lng,a.lat,a.lng) : Infinity;
        var db = (b.lat!=null)? haversine(state.coords.lat,state.coords.lng,b.lat,b.lng) : Infinity;
        return da-db;
      });
    } else {
      records.sort(function(a,b){return (b.modal_price||0)-(a.modal_price||0);});
    }
    return {records:records, meta:meta};
  }
};

var priceLoadToken = 0;
async function loadPrices(){
  var list = document.getElementById('priceList'), status = document.getElementById('priceStatus');
  if(!list) return;
  var token = ++priceLoadToken;
  var f = state.screenParams||{};
  list.innerHTML = '<div class="emptystate"><span class="ico">⏳</span>'+esc(t('checking'))+'</div>';
  var notes = '';
  if(navigator.onLine===false) notes += '<div class="disclaimer soft">📶 '+esc(t('netRequired'))+'</div>';
  try{
    var res = await MandiPriceService.getPrices({crop:f.crop||'', state:f.state||'', sort:f.sort||'highest'});
    if(token!==priceLoadToken || !document.getElementById('priceList')) return;
    if(!res.meta.live) notes += '<div class="disclaimer soft">'+esc(t('liveTempUnavailable'))+'</div>';
    notes += '<div class="subtle" style="margin-bottom:10px;">'+esc(t('dataSourceLabel'))+': <b>'+esc(res.meta.source)+'</b> · '+(res.meta.live? esc(t('statusLive')) : esc(t('statusDemo')))+'</div>';

/* ============== RENDER DISPATCH ============== */
function render(){
  var app = document.getElementById('app');
  var body;
  switch(state.screen){
    case 'home': body = screenHome(); break;
    case 'search': body = screenSearch(); break;
    case 'cropDetail': body = screenCropDetail(state.screenParams.crop); break;
    case 'prices': body = screenPrices(); break;
    case 'nearby': body = screenNearby(); break;
    case 'compare': body = screenCompare(); break;
    case 'whereSell': body = screenWhereSell(state.screenParams.crop); break;
    case 'disease': body = screenDisease(); break;
    case 'photoId': body = screenPhotoId(); break;
    case 'tips': body = screenTips(); break;
    case 'gov': body = screenGov(); break;
    case 'dashboard': body = screenDashboard(); break;
    default: body = screenHome();
  }
  app.innerHTML = topbarHTML() + body + bottomNavHTML() +
    (speechSupported() && state.screen!=='disease' ? '<button class="fab-mic" id="voiceFab" title="'+esc(t('voiceAssistant'))+'">🎙️</button>' : '');
  document.documentElement.setAttribute('dir', state.lang==='ur' ? 'rtl' : 'ltr');
  wireEvents();
}

/* ============== EVENTS ============== */
function wireEvents(){
  var app = document.getElementById('app');
  app.querySelectorAll('[data-nav]').forEach(function(node){
    node.addEventListener('click', function(){
      var target = node.getAttribute('data-nav');
      var cropAttr = node.getAttribute('data-crop');
      if(cropAttr){ addRecent(cropAttr); go(target==='search'?'cropDetail':target, {crop:cropAttr}); }
      else go(target, {});
    });
  });
  var langBtn = document.getElementById('btnLang');
  if(langBtn) langBtn.addEventListener('click', openLangModal);
  var locBtn = document.getElementById('btnLoc');
  if(locBtn) locBtn.addEventListener('click', function(){ go('nearby',{}); });

  var topSearch = document.getElementById('topSearch');
  if(topSearch){
    topSearch.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ runTopSearch(topSearch.value); }
    });
  }
  var topMic = document.getElementById('topMic');
  if(topMic){
    topMic.addEventListener('click', function(){
      topMic.classList.add('listening');
      startListening(function(text){ topSearch.value=text; runTopSearch(text); }, function(){ topMic.classList.remove('listening'); });
    });
  }
  var voiceFab = document.getElementById('voiceFab');
  if(voiceFab) voiceFab.addEventListener('click', openVoiceModal);

  app.querySelectorAll('[data-crop]:not([data-nav])').forEach(function(node){
    node.addEventListener('click', function(){
      var id = node.getAttribute('data-crop');
      addRecent(id);
      go('cropDetail', {crop:id});
    });
  });
  app.querySelectorAll('[data-fav]').forEach(function(node){
    node.addEventListener('click', function(){ toggleFav(node.getAttribute('data-fav')); });
  });

  // screen-specific wiring
  if(state.screen==='prices') wirePrices();
  if(state.screen==='nearby') wireNearby();
  if(state.screen==='compare') wireCompare();
  if(state.screen==='whereSell') wireWhereSell();
  if(state.screen==='disease') wireDisease();
  if(state.screen==='photoId') wirePhotoId();
}

function runTopSearch(query){
  var c = matchCrop(query);
  if(c){ addRecent(c.id); go('cropDetail', {crop:c.id}); }
  else { go('search', {}); var res=document.getElementById('searchResults'); if(res) res.innerHTML='<div class="emptystate"><span class="ico">🔎</span>'+esc(t('noResults'))+'</div>'; }
}

function wirePrices(){
  var app=document.getElementById('app');
  var fCrop=document.getElementById('fCrop'), fState=document.getElementById('fState');
  function update(){ go('prices', {crop:fCrop.value, state:fState.value, sort:state.screenParams.sort||'highest'}); }
  if(fCrop) fCrop.addEventListener('change', update);
  if(fState) fState.addEventListener('change', update);
  app.querySelectorAll('[data-sort]').forEach(function(btn){
    btn.addEventListener('click', function(){ go('prices', {crop:state.screenParams.crop, state:state.screenParams.state, sort:btn.getAttribute('data-sort')}); });
  });
  loadPrices();
}

function wireNearby(){
  var btnUseLoc = document.getElementById('btnUseLoc');
  if(btnUseLoc){
    btnUseLoc.addEventListener('click', function(){
      btnUseLoc.textContent = '…';
      if(!navigator.geolocation){ alert(t('locationDenied')); render(); return; }
      navigator.geolocation.getCurrentPosition(function(pos){
        state.coords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
        var nearest = MANDIS.slice().sort(function(a,b){
          return haversine(state.coords.lat,state.coords.lng,a.lat,a.lng)-haversine(state.coords.lat,state.coords.lng,b.lat,b.lng);
        })[0];
        state.locState = nearest.state; state.locDistrict = nearest.district;
        saveLocal(); render();
      }, function(){ alert(t('locationDenied')+' '+t('errorLocation')); render(); }, {timeout:8000});
    });
  }
  var nearState = document.getElementById('nearState');
  var btnSave = document.getElementById('btnSaveManualLoc');
  if(btnSave){
    btnSave.addEventListener('click', function(){
      state.locState = nearState.value; state.coords=null; saveLocal(); render();
    });
  }
  var btnChange = document.getElementById('btnChangeLoc');
  if(btnChange){ btnChange.addEventListener('click', function(){ state.locState=''; state.locDistrict=''; state.coords=null; render(); }); }
}

function wireCompare(){
  var app=document.getElementById('app');
  app.querySelectorAll('[data-cmpmandi]').forEach(function(cb){
    cb.addEventListener('change', function(){
      var name = cb.getAttribute('data-cmpmandi');
      var i = state.compareSelection.indexOf(name);
      if(cb.checked && i<0) state.compareSelection.push(name);
      if(!cb.checked && i>=0) state.compareSelection.splice(i,1);
      render();
    });
  });
  var cmpCrop = document.getElementById('cmpCrop');
  if(cmpCrop) cmpCrop.addEventListener('change', function(){ go('compare', {crop:cmpCrop.value}); });
}

        "3) your confidence as Low, Medium or High. If the photo is unclear or you are not confident, say so plainly instead of guessing. "+
        "Reply in under 100 words, plain text, in this format on separate lines: 'Crop: ...', 'Issue: ...', 'Confidence: ...', 'Note: ...'. "+
        "Reply in "+((LANG_META.filter(function(l){return l.code===state.lang;})[0]||{}).name||'English')+" language.";

      }
    });
  }
}

/* ============== MODALS ============== */
function openModal(innerHTML, onMount){
  var overlay = el('<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet">'+innerHTML+'</div></div>');
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeModal(); });
  if(onMount) onMount(overlay);
}
function closeModal(){ var o=document.getElementById('modalOverlay'); if(o) o.remove(); }

function openLangModal(){
  var html = '<div class="modal-title">'+esc(t('selectLanguage'))+'<button class="closex" id="mClose">✕</button></div>' +
    '<div class="lang-grid">' + LANG_META.map(function(l){
      return '<button class="lang-opt'+(state.lang===l.code?' active':'')+'" data-lang="'+l.code+'">'+esc(l.native)+'<small>'+esc(l.name)+'</small></button>';
    }).join('') + '</div>';
  openModal(html, function(overlay){
    overlay.querySelector('#mClose').addEventListener('click', closeModal);
    overlay.querySelectorAll('[data-lang]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.lang = btn.getAttribute('data-lang'); saveLocal(); closeModal(); render(); });
    });
  });
}

function openVoiceModal(){
  var html = '<div class="modal-title">🎙️ '+esc(t('voiceAssistant'))+'<button class="closex" id="mClose">✕</button></div>' +
    '<div class="subtle" style="margin-bottom:10px;">'+esc(t('askAnything'))+'</div>' +
    '<div id="voiceStatus" class="subtle" style="margin-bottom:8px;"></div>' +
    '<div style="display:flex;gap:8px;align-items:flex-start;">' +
      '<textarea id="voiceText" placeholder="'+esc(t('typeInstead'))+'"></textarea>' +
      (speechSupported()? '<button class="mic-btn" id="voiceMic">🎙️</button>':'') +
    '</div>' +
    (sampleFn? '<button class="btn btn-primary" id="voiceAsk" style="width:100%;margin-top:10px;">✨ '+esc(t('askAI'))+'</button>' : '<div class="subtle" style="margin-top:10px;">'+esc(t('aiUnavailable'))+'</div>') +
    '<div id="voiceAnswer"></div>';
  openModal(html, function(overlay){
    overlay.querySelector('#mClose').addEventListener('click', closeModal);
    var mic = overlay.querySelector('#voiceMic');
    var ta = overlay.querySelector('#voiceText');
    var status = overlay.querySelector('#voiceStatus');
    if(mic){
      mic.addEventListener('click', function(){
        mic.classList.add('listening'); status.textContent = t('listening');
        startListening(function(text){ ta.value = text; status.textContent=''; }, function(){ mic.classList.remove('listening'); status.textContent=''; });
      });
    }
    var askBtn = overlay.querySelector('#voiceAsk');
    if(askBtn){
      askBtn.addEventListener('click', async function(){
        var q = ta.value.trim(); if(!q) return;
        var out = overlay.querySelector('#voiceAnswer');
        out.innerHTML = '<div class="ai-box thinking" style="margin-top:10px;">'+esc(t('aiThinking'))+'</div>';
        var prompt = "You are a helpful voice assistant inside an Indian farming app called Kisan Mandi. "+
          "Answer the farmer's question in under 120 words, simply and practically. "+
          "If it needs a current mandi price, tell them this demo app only has sample data and to check the Prices screen or Agmarknet for live prices — do not invent a price. "+
          "Never give exact pesticide dosages. Reply in "+((LANG_META.filter(function(l){return l.code===state.lang;})[0]||{}).name||'English')+" language, plain text.\n\nQuestion: "+q;
        try{
          var res = await sampleFn(prompt, {modelTier:'default', onText:function(u){ out.innerHTML='<div class="ai-box" style="margin-top:10px;">'+esc(u.text)+'</div>'; }});
          out.innerHTML = '<div class="ai-box" style="margin-top:10px;">'+esc(res.text)+'</div>';
          if(window.speechSynthesis) speak(res.text);
        }catch(e){ out.innerHTML = '<div class="ai-box" style="margin-top:10px;">'+esc(t('aiUnavailable'))+'</div>'; }
      });
    }
  });
}

/* ============== INIT ============== */
async function init(){
  await initSample();
  render();
}
init();

})();
</script>
